<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trade Journal</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0e0d16;--s1:#16151f;--s2:#1d1c2a;--ln:#2a2840;--tx:#ece9f6;--mu:#8c88a6;--win:#3be9a8;--loss:#ff6f7d;--be:#e8c46a;--pu:#9945ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 'Instrument Sans',system-ui,sans-serif}
h1,h2,.num{font-family:'Bricolage Grotesque','Instrument Sans',sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:28px 18px 80px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:30px;margin:0;letter-spacing:-.5px}
.sub{color:var(--mu);font-size:13px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:linear-gradient(90deg,var(--pu),#14c8c8);border:0;color:#fff;font-weight:600;padding:11px 20px;border-radius:12px}
.ghost{background:var(--s2);border:1px solid var(--ln);padding:8px 14px;border-radius:10px;color:var(--mu);font-size:13px}
.ghost:hover{color:var(--tx)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:22px 0 14px}
.st{background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:14px 16px}
.st b{display:block;font-size:24px;font-family:'Bricolage Grotesque',sans-serif}
.st span{color:var(--mu);font-size:12px}
.curve{background:var(--s1);border:1px solid var(--ln);border-radius:16px;padding:14px 16px 8px;margin-bottom:18px}
.curve svg{width:100%;height:110px;display:block}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:var(--s2);border:1px solid var(--ln);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--mu);user-select:none}
.chip:hover{color:var(--tx)}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx);font-weight:600}
.chip.on.win{background:var(--win);border-color:var(--win)}.chip.on.loss{background:var(--loss);border-color:var(--loss)}.chip.on.be{background:var(--be);border-color:var(--be)}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;background:var(--s1);border:1px solid var(--ln);border-left:4px solid var(--mu);border-radius:14px;padding:12px 16px;margin-bottom:8px;cursor:pointer}
.row:hover{background:var(--s2)}
.row.win{border-left-color:var(--win)}.row.loss{border-left-color:var(--loss)}.row.be{border-left-color:var(--be)}
.row .n{color:var(--mu);font-size:13px}
.row .t{font-weight:600}.row .m{color:var(--mu);font-size:13px;display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.tag{background:var(--s2);border-radius:6px;padding:1px 8px;font-size:12px}
.pnl{text-align:right;font-family:'Bricolage Grotesque',sans-serif;font-size:20px}.pnl small{display:block;font-size:12px;color:var(--mu);font-family:'Instrument Sans',sans-serif}
.pos{color:var(--win)}.neg{color:var(--loss)}
.empty{text-align:center;color:var(--mu);padding:60px 10px;border:1px dashed var(--ln);border-radius:16px}
.ov{position:fixed;inset:0;background:rgba(5,4,10,.75);backdrop-filter:blur(4px);display:none;justify-content:center;align-items:flex-start;overflow:auto;padding:24px 12px;z-index:20}
.ov.open{display:flex}
.panel{background:var(--s1);border:1px solid var(--ln);border-radius:20px;width:100%;max-width:680px;padding:22px 22px 26px}
.panel h2{margin:0 0 4px;font-size:22px}
.f{margin-top:18px}.f>label{display:block;color:var(--mu);font-size:13px;margin-bottom:7px}
.chips{display:flex;gap:7px;flex-wrap:wrap}
input,textarea{width:100%;background:var(--s2);border:1px solid var(--ln);border-radius:10px;color:var(--tx);padding:10px 12px;font:inherit}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--pu);outline-offset:1px}
textarea{min-height:76px;resize:vertical}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.slot{aspect-ratio:16/10;border:1px dashed var(--ln);border-radius:12px;background:var(--s2);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mu);font-size:12px;cursor:pointer;padding:6px}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot i{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.65);padding:1px 8px;border-radius:6px;font-style:normal;color:#fff}
.slot u{position:absolute;right:6px;top:6px;background:rgba(0,0,0,.7);border-radius:50%;width:22px;height:22px;text-decoration:none;color:#fff;line-height:22px;z-index:2}
.bar{display:flex;gap:10px;justify-content:space-between;margin-top:24px;flex-wrap:wrap}
.det .shots img{width:100%;border-radius:12px;cursor:zoom-in;border:1px solid var(--ln)}
.det .shots figure{margin:0}.det figcaption{color:var(--mu);font-size:12px;margin-top:4px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:14px}
.kv div{background:var(--s2);border-radius:10px;padding:8px 12px}.kv span{display:block;color:var(--mu);font-size:11px}
#lb{background:rgba(0,0,0,.92);align-items:center;cursor:zoom-out}#lb img{max-width:96%;max-height:94vh;border-radius:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 18px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:40}
.toast.on{opacity:1}
.wrap{max-width:1180px}
.tabs{display:flex;gap:6px;margin:22px 0 16px;background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:5px;width:max-content;max-width:100%}
.tab{background:none;border:0;padding:8px 20px;border-radius:10px;color:var(--mu);font-weight:500}
.tab.on{background:var(--s2);color:var(--tx);box-shadow:inset 0 0 0 1px var(--ln)}
.view{display:none}.view.on{display:block}
.dgrid{display:grid;grid-template-columns:2fr 1fr;gap:12px}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:18px;padding:16px 18px;min-width:0}
.stats{margin:0 0 12px}
#eq{width:100%;height:200px;display:block;margin-top:8px}#daily{width:100%;display:block;margin-top:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.cd{min-height:60px;border-radius:10px;background:var(--s2);padding:5px 7px;font-size:11px;color:var(--mu)}.cd.e{background:none}
.cd b{display:block;font-size:13px;margin-top:3px;font-family:'Bricolage Grotesque',sans-serif;color:var(--tx)}
.ch{display:flex;justify-content:space-between;align-items:center}.ch span.num{font-size:18px}
.igrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.ir{display:grid;grid-template-columns:1.2fr .5fr .5fr 1fr;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--ln);font-size:13px}
.ib{height:6px;border-radius:3px;background:var(--s2)}.ib i{display:block;height:100%;border-radius:3px}
.tip{border-left:3px solid var(--pu);padding:8px 14px;margin:0 0 8px;background:var(--s1);border-radius:0 12px 12px 0;font-size:14px}.tip.bad{border-color:var(--loss)}.tip.good{border-color:var(--win)}
@media(max-width:760px){.dgrid{grid-template-columns:1fr}.cd{min-height:46px;padding:3px 4px}}
body{background:radial-gradient(900px 500px at 85% -10%,rgba(153,69,255,.22),transparent 60%),radial-gradient(700px 420px at -10% 8%,rgba(20,241,149,.09),transparent 60%),var(--bg);background-attachment:fixed}
h1{font-size:36px;background:linear-gradient(90deg,#fff,#c3adff);-webkit-background-clip:text;background-clip:text;color:transparent}
.tabs{position:sticky;top:calc(8px + env(safe-area-inset-top,0px));z-index:5;backdrop-filter:blur(14px);background:rgba(22,21,31,.82)}
.card,.st{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01)),var(--s1);transition:border-color .2s}.card:hover,.st:hover{border-color:#4a4570}
.st b{font-size:27px;letter-spacing:-.5px}
.row{transition:transform .15s,background .15s}.row:hover{transform:translateX(3px)}
.btn{transition:box-shadow .2s,filter .2s}.btn:hover{filter:brightness(1.1);box-shadow:0 6px 26px rgba(153,69,255,.4)}.btn[disabled]{opacity:.55;pointer-events:none}
.md{line-height:1.65;font-size:15px;max-width:72ch}.md h3{font-family:'Bricolage Grotesque',sans-serif;font-size:18px;margin:22px 0 6px;color:#fff}.md h3:first-child{margin-top:0}.md ul{padding-left:20px;margin:6px 0}.md li{margin:5px 0}.md b{color:#fff}
#v-coach{display:none!important}
.st{position:relative;overflow:hidden;padding-top:17px}.st::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--pu),#14f195);opacity:.7}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}.pb input{font-variant-numeric:tabular-nums}
.pb{background:var(--s2);border:1px solid var(--ln);border-radius:14px;padding:14px}.pb input{background:var(--bg)}
.calc{margin-top:10px;font-size:13px;color:var(--tx);opacity:.85}
.tdy{display:flex;gap:16px;flex-wrap:wrap;align-items:center;background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:10px 18px;margin-bottom:12px;font-size:14px}.tdy b{margin-right:6px}
.rv{display:grid;grid-template-columns:1fr 1fr;gap:26px}.rh{font-size:17px;margin:0 0 6px}
.rvi{padding:10px 0 10px 16px;border-top:1px solid var(--ln);position:relative;font-size:14px}.rvi b{display:block}.rvi span{color:var(--mu);font-size:13px}
.rvi::before{content:'';position:absolute;left:0;top:14px;width:6px;height:6px;border-radius:50%}.g .rvi::before{background:var(--win)}.b .rvi::before{background:var(--loss)}
.row{padding:14px 18px}.row .n{width:34px;height:34px;border-radius:50%;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:12px}
@media(max-width:760px){.rv{grid-template-columns:1fr;gap:16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body><div class="wrap">
<header><div><h1>Trade Journal</h1><div class="sub" id="sub"></div></div>
<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="ghost" id="exp">Backup</button><button class="ghost" id="imp">Restore</button><button class="btn" id="new">+ Log trade</button></div></header>
<nav class="tabs"><button class="tab on" data-tab="dash">Dashboard</button><button class="tab" data-tab="trades">Trades</button><button class="tab" data-tab="ins">Insights</button></nav>
<section class="view on" id="v-dash"><div class="stats" id="stats"></div>
<div id="today"></div><div id="review"></div>
<div class="dgrid"><div class="card"><div class="sub">Cumulative net PnL</div><svg id="eq" viewBox="0 0 600 110" preserveAspectRatio="none"></svg></div>
<div class="card"><div class="sub">Journal score</div><div id="radar"></div></div>
<div class="card"><div id="cal"></div></div>
<div class="card"><div class="sub">Daily PnL · last 14 trading days</div><svg id="daily" viewBox="0 0 300 130"></svg></div><div class="card" id="goal" style="grid-column:1/-1"></div></div></section>
<section class="view" id="v-trades"><div class="filters" id="filters"></div><div id="list"></div></section>
<section class="view" id="v-coach"><div class="card"><h2 style="margin:0;font-size:24px">AI trade coach</h2><div class="sub">Reads your results, tags and notes, then calls out the patterns that are costing you.</div><div class="chips" style="margin:18px 0"><span class="chip on" data-cn="10">Last 10 trades</span><span class="chip" data-cn="25">Last 25</span><span class="chip" data-cn="0">All trades</span></div><button class="btn" id="coachgo">Review my trades</button><div id="coachout" style="margin-top:22px"></div></div></section>
<section class="view" id="v-ins"><div id="tips"></div><div class="igrid" id="ins"></div></section>
</div>

<div class="ov" id="ov"><div class="panel" id="panel"></div></div>
<div class="ov" id="lb"><img alt=""></div>
<input type="file" id="file" accept="image/*" hidden><input type="file" id="rest" accept=".json" hidden>
<div class="toast" id="toast">Saved</div>

<script>
const OPT={
 pair:['SOL','ETH','BTC'],
 type:['Trendline','SMC / OB','Breakout','Range','Reversal','Liquidity sweep'],
 tf:['1m','3m','5m','15m','1h','4h'],
 pos:['Long','Short'],
 res:['Win','BE','Loss'],
 session:['Asia','London','New York'],
 emo:['Calm','Confident','FOMO','Fear','Revenge','Bored'],
 mist:['None','Early entry','Late entry','Moved SL','Oversized','No setup','Held too long','Ignored plan']
};
const SLOTS=['Setup / HTF','Entry','Result'];
const KEY='tradejournal.v1';
let trades=[];try{trades=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}
let custom={};try{custom=JSON.parse(localStorage.getItem(KEY+'.opts')||'{}')}catch(e){}
let filter='All',cur=null,slotIdx=0;
const $=s=>document.querySelector(s);
const opts=k=>[...OPT[k],...(custom[k]||[])];
function save(){try{localStorage.setItem(KEY,JSON.stringify(trades));localStorage.setItem(KEY+'.opts',JSON.stringify(custom));return true}catch(e){toast('Storage full — use Backup, then delete old shots');return false}}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1600)}
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const dayName=d=>new Date(d+'T12:00').toLocaleDateString('en',{weekday:'long'});
const fmtD=d=>new Date(d+'T12:00').toLocaleDateString('en',{month:'short',day:'numeric',year:'numeric'});
const money=n=>(n<0?'-':n>0?'+':'')+'$'+Math.abs(n).toFixed(2);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(){extra();
 const done=trades.filter(t=>t.res);
 const wins=done.filter(t=>t.res==='Win').length,net=done.reduce((a,t)=>a+(+t.pnl||0),0);
 const rs=done.filter(t=>t.r!==''&&t.r!=null).map(t=>+t.r),avgR=rs.length?rs.reduce((a,b)=>a+b,0)/rs.length:0;
 const gp=done.filter(t=>t.pnl>0).reduce((a,t)=>a+ +t.pnl,0),gl=Math.abs(done.filter(t=>t.pnl<0).reduce((a,t)=>a+ +t.pnl,0));
 let streak=0,sr='';for(let i=trades.length-1;i>=0;i--){const r=trades[i].res;if(!r||r==='BE')continue;if(!sr)sr=r;if(r===sr)streak++;else break}
 $('#sub').textContent=trades.length+' trades logged · saved in this browser';
 const S=(v,l,c)=>`<div class="st"><b class="${c||''}">${v}</b><span>${l}</span></div>`;
 $('#stats').innerHTML=S(trades.length,'Trades')+S(done.length?Math.round(wins/done.length*100)+'%':'–','Win rate')+S(money(net),'Net PnL',net>0?'pos':net<0?'neg':'')+S(avgR?avgR.toFixed(2)+'R':'–','Avg R')+S(gl?(gp/gl).toFixed(2):gp?'∞':'–','Profit factor')+S(streak?streak+(sr==='Win'?'W':'L'):'–','Current streak',sr==='Win'?'pos':'neg');
 // equity
 const pts=[0];done.slice().sort((a,b)=>a.date<b.date?-1:1).forEach(t=>pts.push(pts[pts.length-1]+(+t.pnl||0)));
 const mn=Math.min(...pts),mx=Math.max(...pts),rg=(mx-mn)||1,W=600,H=110;
 const xy=pts.map((p,i)=>[pts.length>1?i/(pts.length-1)*W:0,H-8-(p-mn)/rg*(H-16)]);
 $('#eq').innerHTML=`<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#9945ff"/><stop offset="1" stop-color="#14f195"/></linearGradient></defs>`+(pts.length>1?`<path d="${xy.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('')}" fill="none" stroke="url(#g)" stroke-width="2.5" vector-effect="non-scaling-stroke"/>`:`<text x="10" y="60" fill="#8c88a6" font-size="13">Log your first closed trade to see the curve</text>`);
 // filters
 const fl=['All',...new Set(trades.map(t=>t.pair).filter(Boolean))];
 $('#filters').innerHTML=fl.map(f=>`<span class="chip ${f===filter?'on':''}" data-f="${esc(f)}">${esc(f)}</span>`).join('');
 const list=trades.map((t,i)=>({t,i})).filter(o=>filter==='All'||o.t.pair===filter).reverse();
 $('#list').innerHTML=list.length?list.map(({t,i})=>{const c=(t.res||'').toLowerCase();
  return `<div class="row ${c}" data-i="${i}"><div class="n">#${i+1}</div><div><div class="t">${esc(t.pair||'–')} ${esc(t.pos||'')} <span class="tag">${esc(t.type||'')}</span></div><div class="m"><span>${fmtD(t.date)}</span>${(t.tf||[]).map(x=>`<span class="tag">${x}</span>`).join('')}${t.emo?`<span>${esc(t.emo)}</span>`:''}${(t.shots||[]).some(Boolean)?'<span>📷</span>':''}</div></div><div class="pnl ${t.pnl>0?'pos':t.pnl<0?'neg':''}">${t.pnl!==''&&t.pnl!=null?money(+t.pnl):'–'}<small>${t.r!==''&&t.r!=null?(+t.r>0?'+':'')+t.r+'R':esc(t.res||'open')}</small></div></div>`}).join(''):`<div class="empty">No trades here yet.<br>Hit “Log trade” right after you close one — it takes about 20 seconds.</div>`;
}

function chips(k,sel,multi,addable){
 return `<div class="chips" data-k="${k}" data-m="${multi?1:0}">`+opts(k).map(o=>{const on=multi?(sel||[]).includes(o):sel===o;return `<span class="chip ${k==='res'?o.toLowerCase():''} ${on?'on':''}" data-v="${esc(o)}">${esc(o)}</span>`}).join('')+(addable?`<span class="chip" data-add="${k}">+ add</span>`:'')+`</div>`;
}
function openForm(idx){
 const t=idx==null?{date:today(),tf:[],shots:[],conf:3,pair:'SOL'}:JSON.parse(JSON.stringify(trades[idx]));
 t.shots=t.shots||[];cur={idx,t};
 $('#panel').innerHTML=`<h2>${idx==null?'Log a trade':'Edit trade #'+(idx+1)}</h2><div class="sub">Tap to choose — everything saves when you hit Save.</div>
 <div class="f"><label>Date</label><input type="date" id="date" value="${t.date}"></div>
 <div class="f"><label>Pair</label>${chips('pair',t.pair,0,1)}</div>
 <div class="f"><label>Position</label>${chips('pos',t.pos)}</div>
 <div class="f"><label>Setup type</label>${chips('type',t.type,0,1)}</div>
 <div class="f pb"><label style="margin-bottom:10px">Prices — R and result fill in automatically</label><div class="g4"><div><label class="sub">Entry</label><input id="entry" type="number" inputmode="decimal" step="any" value="${t.entry??''}"></div><div><label class="sub">Stop loss</label><input id="sl" type="number" inputmode="decimal" step="any" value="${t.sl??''}"></div><div><label class="sub">Take profit</label><input id="tp" type="number" inputmode="decimal" step="any" value="${t.tp??''}"></div><div><label class="sub">Exit price</label><input id="exit" type="number" inputmode="decimal" step="any" value="${t.exit??''}"></div></div><div class="calc" id="calc">Enter entry and stop loss to see risk and R:R</div></div>
 <div class="f"><label>Timeframes used</label>${chips('tf',t.tf,1)}</div>
 <div class="f"><label>Session</label>${chips('session',t.session)}</div>
 <div class="f"><label>Result</label>${chips('res',t.res)}</div>
 <div class="f g3"><div><label class="sub">R multiple</label><input id="r" type="number" step="0.1" placeholder="e.g. 3.5" value="${t.r??''}"></div><div><label class="sub">Net PnL $</label><input id="pnl" type="number" step="0.01" placeholder="e.g. 3.42" value="${t.pnl??''}"></div><div><label class="sub">Risk %</label><input id="risk" type="number" step="0.1" placeholder="e.g. 1" value="${t.risk??''}"></div></div>
 
 <div class="f"><label>Confidence before entry</label><div class="chips" data-k="conf" data-m="0">${[1,2,3,4,5].map(n=>`<span class="chip ${t.conf===n?'on':''}" data-v="${n}">${n}</span>`).join('')}</div></div>
 <div class="f"><label>How did you feel?</label>${chips('emo',t.emo,0,1)}</div>
 <div class="f"><label>Mistake made</label>${chips('mist',t.mist,0,1)}</div>
 <div class="f"><label>Did you follow your plan?</label>${chips('plan',t.plan)}</div>
 <div class="f"><label>Screenshots — tap a box, or paste with Ctrl+V</label><div class="shots" id="shots"></div></div>
 <div class="f"><label>Why I took it</label><textarea id="why" placeholder="What did you see?">${esc(t.why)}</textarea></div>
 <div class="f"><label>Lesson / what I'd change</label><textarea id="lesson">${esc(t.lesson)}</textarea></div>
 <div class="bar"><button class="ghost" id="cancel">Cancel</button><span style="display:flex;gap:8px">${idx!=null?'<button class="ghost" id="del" style="color:var(--loss)">Delete</button>':''}<button class="btn" id="save">Save trade</button></span></div>`;
 drawSlots();$('#ov').classList.add('open');
}
function drawSlots(){

 if(!e||!s||e===s){$('#calc').textContent='Enter entry and stop loss to see risk and R:R';return}
 const dir=t.pos?(t.pos==='Long'?1:-1):(s<e?1:-1),risk=Math.abs(e-s),bits=['Risk '+(risk/e*100).toFixed(2)+'% of price'];
 if(p){const rw=(p-e)*dir;bits.push(rw>0?'reward '+(rw/e*100).toFixed(2)+'% · planned 1:'+(rw/risk).toFixed(1):'take profit is on the wrong side')}
 if((s<e)!==(dir>0))bits.push('stop is on the wrong side');
 let r=null;if(x)r=(x-e)*dir/risk;else if(t.res==='Win'&&p)r=(p-e)*dir/risk;else if(t.res==='Loss')r=-1;else if(t.res==='BE')r=0;
 if(x&&r!=null){bits.push('exit = '+(r>0?'+':'')+r.toFixed(2)+'R');if(!t.res){t.res=r>.05?'Win':r<-.05?'Loss':'BE';document.querySelectorAll('[data-k=res] .chip').forEach(c=>c.classList.toggle('on',c.dataset.v===t.res))}}
 $('#calc').textContent=bits.join(' · ');
 const ri=$('#r');if(r!=null&&!ri.dataset.m)ri.value=(+r.toFixed(2)).toString()}
document.addEventListener('input',ev=>{if(ev.target.id==='r')ev.target.dataset.m='1';if(['entry','sl','tp','exit'].includes(ev.target.id))calcPlan()});
document.addEventListener('click',ev=>{if(ev.target.closest('.panel .chip'))setTimeout(calcPlan);const g=ev.target.closest('[data-goal]');if(g){const v=prompt('Monthly profit goal in $:');if(v!==null){try{localStorage.setItem(KEY+'.goal',String(Math.max(0,+v||0)))}catch(_){}extra()}}});
paintCoach();
render();
</script></body></html>
